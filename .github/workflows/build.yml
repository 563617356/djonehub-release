name: Build Binaries

# Builds the three-architecture DJOneHub Linux binaries from source and uploads
# them to a GitHub release in THIS repo (djonehub-release), tagged vX.Y.Z.
# The luci-app-djonehub package downloads djonehub_vX.Y.Z_linux_{arm64,armv7,amd64}
# from here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

env:
  TZ: Asia/Shanghai
  SOURCE_REPO: 563617356/DJOneHub-mac-enhanced
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Clone source
        run: |
          set -eu
          TOKEN="${{ secrets.SOURCE_TOKEN || secrets.GITHUB_TOKEN }}"
          if [ -n "${SOURCE_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${SOURCE_REPO}.git" src
          else
            git clone --depth 1 "https://github.com/${SOURCE_REPO}.git" src
          fi
          cd src && echo "source commit: $(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          check-latest: true

      - name: Cross-compile (arm64 / armv7 / amd64)
        working-directory: src
        run: |
          set -eu
          mkdir -p ../dist
          declare -A M=( [arm64]=arm64 [armv7]=arm [amd64]=amd64 )
          for arch in arm64 armv7 amd64; do
            goarch="${M[$arch]}"
            echo ">> linux/$goarch"
            GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 GOTOOLCHAIN=auto \
              go build -mod=mod -o "../dist/djonehub_${VERSION}_linux_${arch}" ./cmd/djonehub-macos
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/djonehub_*
          generate_release_notes: true
